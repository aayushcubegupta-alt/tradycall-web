<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Rounded forest green background card -->
  <rect width="240" height="80" rx="12" fill="#0D5233" />
  
  <!-- Three iconic warehouse roof gables -->
  <path d="M20 48 L30 34 L40 48 M40 48 L50 34 L60 48 M60 48 L70 34 L80 48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "BUNNINGS" wordmark -->
  <text x="94" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="-0.02em">BUNNINGS</text>
  
  <!-- "TRADE" badge red -->
  <rect x="94" y="47" width="65" height="17" rx="4" fill="#E11D48" />
  <text x="104" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="0.12em">TRADE</text>
</svg>
